<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" width="100%" height="100%">
  <defs>
    <!-- Icon Card Gradient -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Drop Shadow for Icon Card -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Drop Shadow for Text -->
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Icon App Badge (Rounded Square) -->
  <g filter="url(#cardShadow)">
    <rect x="20" y="20" width="80" height="80" rx="20" fill="url(#iconBg)"/>

    <!-- Open Book Icon inside Badge -->
    <g transform="translate(36, 52)" fill="#FFFFFF">
      <!-- Left Page -->
      <path d="M 0 0 C 8 -4, 18 -4, 22 4 L 22 26 C 18 18, 8 18, 0 22 Z"/>
      <!-- Right Page -->
      <path d="M 48 0 C 40 -4, 30 -4, 26 4 L 26 26 C 30 18, 40 18, 48 22 Z"/>
      <!-- Book Spine Shadow Line -->
      <line x1="24" y1="4" x2="24" y2="28" stroke="#1D4ED8" stroke-width="1.5"/>
    </g>

    <!-- Graduation Cap Icon inside Badge -->
    <g transform="translate(60, 42)">
      <!-- Cap Top Diamond -->
      <polygon points="0,-12 20,-3 0,6 -20,-3" fill="#FFFFFF"/>
      <!-- Cap Base -->
      <path d="M -10 1 Q 0 6 10 1 L 10 7 Q 0 12 -10 7 Z" fill="#E2E8F0"/>
      <!-- Tassel Wire & Fringe -->
      <path d="M 0 -3 Q 14 -1 15 8" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="15" cy="10" r="1.5" fill="#E2E8F0"/>
    </g>
  </g>

  <!-- Complete Title Text: "EDU PORTAL" -->
  <text x="120" y="73" 
        fill="#FFFFFF" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="36" 
        font-weight="800" 
        letter-spacing="1.5"
        filter="url(#textShadow)">
    EDU PORTAL
  </text>
</svg>
