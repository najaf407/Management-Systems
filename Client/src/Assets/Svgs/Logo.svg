<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon Container -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Drop Shadow for Icon Container -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Container Group -->
  <g filter="url(#softShadow)" transform="translate(10, 10)">
    
    <!-- Icon Box: Blue Background -->
    <rect x="10" y="10" width="120" height="120" rx="28" fill="url(#blueGradient)" />

    <!-- Open Book Symbol (White) -->
    <path d="M 42,62 Q 70,52 70,85 Q 70,52 98,62 L 98,95 Q 70,85 70,108 Q 70,85 42,95 Z" 
          fill="#ffffff" />
    <path d="M 70,58 L 70,108" stroke="#1e3a8a" stroke-width="3" stroke-linecap="round" />

    <!-- Graduation Cap Accent (White) -->
    <polygon points="70,32 96,42 70,52 44,42" fill="#ffffff" />
    <path d="M 90,46 L 90,60" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

    <!-- Text: "EDU" in Pure White -->
    <text x="155" y="92" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="900" 
          font-size="64" 
          fill="#ffffff" 
          letter-spacing="-1">
      EDU
    </text>

    <!-- Text: "PORTAL" in Pure White -->
    <text x="300" y="92" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="700" 
          font-size="64" 
          fill="#ffffff" 
          letter-spacing="0">
      PORTAL
    </text>

  </g>
</svg>
